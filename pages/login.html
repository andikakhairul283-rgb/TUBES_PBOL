<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Sistem Manajemen Hotel</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body class="auth">
  <main class="card card-gold auth-card"><div class="card-body">
    <div class="auth-brand">
      <div class="brand-mark">H</div>
      <div><div class="brand-name">Hotel Manager</div><div class="brand-sub">Sistem manajemen hotel</div></div>
    </div>
    <h2>Masuk</h2>
    <p class="text-muted">Gunakan akun yang diberikan administrator.</p>
    <form id="login" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" class="form-control" placeholder="Masukkan username" autocomplete="username">
        <div class="form-error hidden">Username wajib diisi.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Kata sandi</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="Masukkan kata sandi" autocomplete="current-password">
        <div class="form-error hidden">Kata sandi minimal 8 karakter.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
    <div class="auth-foot"><a href="#">Lupa kata sandi?</a></div>
  </div></main>
  <script>
    document.getElementById("login").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = this, ok = true;
      [[f.username, f.username.value.trim() !== ""], [f.password, f.password.value.length >= 8]].forEach(function (c) {
        c[0].classList.toggle("is-invalid", !c[1]);
        c[0].parentNode.querySelector(".form-error").classList.toggle("hidden", c[1]);
        if (!c[1]) ok = false;
      });
      if (ok) location.href = "dashboard.html"; // sementara: belum ada autentikasi
    });
  </script>
</body>
</html>
